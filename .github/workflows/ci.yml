name: A07 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  simulation:
    name: Functional Simulation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run functional simulation
        run: bash 04_IMPLEMENTATION/scripts/01_run_sim.sh

      - name: Upload simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a07-simulation-results
          path: |
            05_VERIFICATION/simulation.log
            05_VERIFICATION/tool_versions.txt
          if-no-files-found: ignore
